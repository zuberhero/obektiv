<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ОБЪЕКТИВ"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>ОБЪЕКТИВ — музыкальная камера</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;background:#101113;color:#f4f4ef}body{padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 22px)}main{width:min(100%,590px);margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:10px}h1{font-weight:900;font-size:clamp(24px,8vw,42px);letter-spacing:-.06em;margin:0}header small{font-size:11px;letter-spacing:.13em;color:#a9b0aa}.viewer{position:relative;background:#222626;aspect-ratio:3/4;max-height:58svh;overflow:hidden;border:1px solid #5f6862;border-radius:18px}video{display:none}canvas{width:100%;height:100%;object-fit:cover;display:block}#guide{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:25px;background:#2229;font-size:15px;line-height:1.6}#guide[hidden]{display:none}.scan{position:absolute;top:0;bottom:0;width:2px;left:0;background:#f5f5d9;box-shadow:0 0 14px #fff7;pointer-events:none;opacity:0}.playing .scan{opacity:1}.indicator{position:absolute;top:12px;left:12px;padding:6px 9px;background:#151818c9;border-radius:6px;font-size:11px;font-weight:750;letter-spacing:.07em}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.modes button,.actions button{border:1px solid #6a746f;background:#262b29;color:white;border-radius:12px;min-height:52px;font-size:15px;font-weight:750}.modes button[aria-pressed=true]{background:#e4ff83;color:#151811;border-color:#e4ff83}.actions{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-top:8px}.actions button.primary{background:#f3f4e9;color:#111;border-color:#f3f4e9}.actions button:disabled{opacity:.4}.panel{border:1px solid #49514d;border-radius:14px;padding:13px 15px;margin-top:13px;display:grid;gap:15px}label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}label output{font-variant-numeric:tabular-nums;color:#bdcbb8}input[type=range]{width:100%;accent-color:#e4ff83;height:28px;touch-action:pan-x}.info{margin-top:12px;font-size:12px;line-height:1.5;color:#acb9b0;min-height:38px}.foot{font-size:11px;color:#7f8a83;margin-top:12px;text-align:center}button:focus-visible,input:focus-visible{outline:3px solid #e4ff83;outline-offset:2px}@media(min-width:560px){.viewer{aspect-ratio:4/3;max-height:600px}}
</style></head><body><main>
<header><h1>ОБЪЕКТИВ</h1><small>МУЗЫКАЛЬНАЯ КАМЕРА · 0.1</small></header>
<div id="viewer" class="viewer"><video id="video" autoplay muted playsinline></video><canvas id="picture" aria-label="Изображение с задней камеры и линия сканирования"></canvas><div id="scan" class="scan"></div><div id="badge" class="indicator">КАМЕРА ВЫКЛЮЧЕНА</div><div id="guide">Нажми «Включить», разреши доступ к задней камере.<br>Изображение начнёт превращаться в музыку.</div></div>
<div class="modes" role="group" aria-label="Музыкальный режим"><button id="ambient" type="button" aria-pressed="true">СОЗЕРЦАНИЕ</button><button id="motion" type="button" aria-pressed="false">ДВИЖЕНИЕ</button></div>
<div class="actions"><button id="start" class="primary" type="button">▶ ВКЛЮЧИТЬ</button><button id="freeze" type="button" disabled>ЗАМОРОЗИТЬ</button></div>
<section class="panel" aria-label="Звук"><div><label for="sensitivity">Чувствительность <output id="sVal">55%</output></label><input id="sensitivity" type="range" min="0" max="100" value="55"></div><div><label for="volume">Громкость <output id="vVal">35%</output></label><input id="volume" type="range" min="0" max="100" value="35"></div></section>
<div class="info" id="status" role="status">Первый запуск требует интернета и разрешения на камеру. Для запуска звука нажми кнопку.</div><div class="foot">Видеопоток анализируется на устройстве и никуда не отправляется.</div>
</main><script>
(()=>{
const $=id=>document.getElementById(id);
const video=$("video"), canvas=$("picture"),ctx=canvas.getContext("2d",{willReadFrequently:true}),mini=document.createElement("canvas"),mctx=mini.getContext("2d",{willReadFrequently:true});
mini.width=48;mini.height=36;
const scan=$("scan"),badge=$("badge"),guide=$("guide"),viewer=$("viewer"),start=$("start"),freeze=$("freeze"),status=$("status");
const sensitivity=$("sensitivity"),volume=$("volume");
let mode="ambient",stream=null,audio=null,master=null,filter=null,voices=[],timer=null,frameHandle=null,running=false,frozen=false,freezeData=null,prior=null,features={light:.5,hue:0,movement:0,contrast:0},smooth={light:.5,hue:0,movement:0,contrast:0},step=0,scanPosition=0;
const noteHz=(m)=>440*Math.pow(2,(m-69)/12);
const scale=[0,2,3,5,7,10,12,14,15,17,19,22];
function setStatus(t){status.textContent=t}
function setMode(m){mode=m;$("ambient").setAttribute("aria-pressed",m==="ambient");$("motion").setAttribute("aria-pressed",m==="motion");setStatus(m==="ambient"?"Созерцание: медленная гармония из цвета и освещения.":"Движение: резкие изменения изображения создают ритм и звуковые вспышки.");if(audio&&filter)filter.frequency.setTargetAtTime(m==="ambient"?950:2200,audio.currentTime,.2)}
$("ambient").addEventListener("click",()=>setMode("ambient"));$("motion").addEventListener("click",()=>setMode("motion"));
sensitivity.addEventListener("input",()=>{$("sVal").textContent=sensitivity.value+"%"});volume.addEventListener("input",()=>{$("vVal").textContent=volume.value+"%";if(master&&audio)master.gain.setTargetAtTime((+volume.value/100)*.36,audio.currentTime,.06)});
function initAudio(){
 if(audio)return;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error("Web Audio не поддерживается");
 audio=new AC();master=audio.createGain();master.gain.value=(+volume.value/100)*.36;filter=audio.createBiquadFilter();filter.type="lowpass";filter.frequency.value=950;filter.Q.value=.5;filter.connect(master);master.connect(audio.destination);
}
function playTone(midi,dur=.6,level=.22,wave="sine"){
 if(!audio||audio.state!=="running")return;
 const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(noteHz(midi),now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.001,level),now+.018);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(filter);o.start(now);o.stop(now+dur+.02);
}
function stopLoops(){clearInterval(timer);timer=null;if(frameHandle)cancelAnimationFrame(frameHandle);frameHandle=null}
function toneTick(){
 if(!running||!audio||audio.state!=="running")return;
 const f=smooth,range=+sensitivity.value/100;
 const center=mode==="ambient"?48:45;const noteOffset=scale[(Math.floor((f.hue*7+f.light*5+step*.67)*1.3)%scale.length+scale.length)%scale.length];
 if(mode==="ambient"){
   if(step%3===0)playTone(center+noteOffset,.9,.12+f.light*.1,"sine");
   if(step%6===0)playTone(center-12+scale[Math.floor(f.hue*5)%7],1.9,.13,"triangle");
 }else{
   const energy=Math.min(1,f.movement*(.4+range*6));
   if(energy>.035||step%4===0){playTone(center+noteOffset,.13+energy*.25,.09+energy*.22,energy>.35?"sawtooth":"triangle")}
   if(energy>.22&&step%2===0){playTone(32+scale[step%7],.09,.09+energy*.1,"square")}
 }
 step++;
}
function readFeatures(){
 if(!video.videoWidth||!video.videoHeight)return;
 mctx.drawImage(video,0,0,48,36);
 const d=mctx.getImageData(0,0,48,36).data;
 let light=0,rr=0,gg=0,bb=0,movement=0,contrast=0,oldLight=0;
 for(let i=0,j=0;i<d.length;i+=4,j++){const r=d[i],g=d[i+1],b=d[i+2],l=(r+g+b)/765;light+=l;rr+=r;gg+=g;bb+=b;contrast+=Math.abs(l-.5);if(prior)movement+=Math.abs(l-prior[j]);}
 const count=48*36;light/=count;rr/=count;gg/=count;bb/=count;movement=prior?movement/count:0;contrast/=count;
 if(!prior)prior=new Float32Array(count);
 for(let i=0,j=0;i<d.length;i+=4,j++)prior[j]=(d[i]+d[i+1]+d[i+2])/765;
 const high=Math.max(rr,gg,bb),low=Math.min(rr,gg,bb),delta=high-low;let hue=0;
 if(delta>0){if(high===rr)hue=((gg-bb)/delta+6)%6;else if(high===gg)hue=(bb-rr)/delta+2;else hue=(rr-gg)/delta+4;hue/=6}
 features={light,hue,movement,contrast};
 const alpha=mode==="ambient"?.045:.34;
 for(const k of Object.keys(features))smooth[k]+=(features[k]-smooth[k])*alpha;
}
function draw(){
 if(!running)return;
 const w=video.videoWidth||640,h=video.videoHeight||480;
 const vw=Math.min(560, Math.max(320, Math.round(canvas.clientWidth*devicePixelRatio)));
 const vh=Math.round(vw*(canvas.clientHeight/Math.max(1,canvas.clientWidth)));
 if(canvas.width!==vw||canvas.height!==vh){canvas.width=vw;canvas.height=vh}
 if(frozen&&freezeData){ctx.drawImage(freezeData,0,0,vw,vh)}
 else if(video.readyState>=2){ctx.drawImage(video,0,0,vw,vh);readFeatures()}
 scanPosition=(scanPosition+(mode==="ambient"?.0018:.011))%1;scan.style.left=(scanPosition*100)+"%";
 frameHandle=requestAnimationFrame(draw);
}
async function begin(){
 if(running){stop();return}
 start.disabled=true;setStatus("Запрашиваю заднюю камеру…");
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error("Камера доступна только на HTTPS и в поддерживаемом браузере.");
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:640},height:{ideal:480},frameRate:{ideal:15,max:24}}});
  video.srcObject=stream;await video.play();initAudio();await audio.resume();
  running=true;frozen=false;prior=null;freezeData=null;
  viewer.classList.add("playing");guide.hidden=true;badge.textContent="● LIVE · ЗАДНЯЯ КАМЕРА";start.textContent="■ ОСТАНОВИТЬ";freeze.disabled=false;freeze.textContent="ЗАМОРОЗИТЬ";start.disabled=false;
  timer=setInterval(toneTick,mode==="ambient"?250:170);frameHandle=requestAnimationFrame(draw);
  setStatus("Музыка звучит. Наведи камеру на свет, цвет и движение.");
 }catch(e){setStatus("Не удалось запустить: "+(e?.message||"проверь разрешение на камеру"));start.disabled=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
}
function stop(){running=false;stopLoops();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;viewer.classList.remove("playing");badge.textContent="КАМЕРА ВЫКЛЮЧЕНА";guide.hidden=false;start.textContent="▶ ВКЛЮЧИТЬ";freeze.disabled=true;frozen=false;freezeData=null;prior=null;setStatus("Остановлено. Для нового запуска нажми «Включить».")}
start.addEventListener("click",begin);
freeze.addEventListener("click",()=>{
 if(!running)return;
 if(!frozen){freezeData=document.createElement("canvas");freezeData.width=canvas.width;freezeData.height=canvas.height;freezeData.getContext("2d").drawImage(canvas,0,0);frozen=true;badge.textContent="❚❚ КАДР ЗАМОРОЖЕН";freeze.textContent="РАЗМОРОЗИТЬ";setStatus("Кадр зафиксирован. Его параметры продолжают управлять музыкой.")}
 else{frozen=false;freezeData=null;prior=null;badge.textContent="● LIVE · ЗАДНЯЯ КАМЕРА";freeze.textContent="ЗАМОРОЗИТЬ";setStatus("Камера снова анализирует изображение в реальном времени.")}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running){stop();setStatus("Камера остановлена при переходе в фон — ограничение iOS.")}});
window.addEventListener("pagehide",()=>{if(running)stop()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
})();
</script></body></html>
